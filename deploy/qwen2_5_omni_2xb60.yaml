# Qwen2.5-Omni served on 2x Intel Arc B60 (23.9 GiB each).
# Derived from vllm_omni/deploy/qwen2_5_omni.yaml: same 3-stage layout
# (thinker on device 0, talker + code2wav on device 1) with a smaller prefill
# batch and headroom, because 16.7 GiB of thinker weights on a 23.9 GiB card
# leaves no room for the default 32k-token activation profile.
async_chunk: false

stages:
  - stage_id: 0
    max_num_batched_tokens: 8192
    max_num_seqs: 1
    gpu_memory_utilization: 0.82
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    mm_processor_cache_gb: 0
    max_model_len: 4096
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 256
      seed: 42
      repetition_penalty: 1.1

  - stage_id: 1
    max_num_batched_tokens: 8192
    max_num_seqs: 1
    gpu_memory_utilization: 0.5
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    default_sampling_params:
      temperature: 0.9
      top_p: 0.8
      top_k: 40
      max_tokens: 256
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_batched_tokens: 8192
    max_num_seqs: 1
    gpu_memory_utilization: 0.15
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    enable_flashinfer_autotune: false
    async_scheduling: false
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 256
      seed: 42
      repetition_penalty: 1.1

platforms:
  xpu:
    stages:
      - stage_id: 0
        devices: "0"
      - stage_id: 1
        devices: "1"
      - stage_id: 2
        devices: "1"
